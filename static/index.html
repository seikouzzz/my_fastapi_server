<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用户管理系统</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="container">
    <h1>用户管理系统</h1>

    <!-- 添加用户 -->
    <section class="card">
      <h2>添加用户</h2>
      <form id="add-form" class="form-grid">
        <div class="field">
          <label for="add-name">姓名</label>
          <input id="add-name" name="name" placeholder="请输入姓名" required>
        </div>
        <div class="field">
          <label for="add-password">密码</label>
          <input id="add-password" name="password" placeholder="请输入密码" required>
        </div>
        <div class="field">
          <label for="add-age">年龄（可选）</label>
          <input id="add-age" name="age" type="number" min="0" max="150" value="0" placeholder="请输入年龄">
        </div>
        <div class="field">
          <label for="add-gender">性别（可选）</label>
          <select id="add-gender" name="gender">
            <option value="男">男</option>
            <option value="女">女</option>
            <option value="未知" selected>未知</option>
          </select>
        </div>
        <button type="submit" class="submit-btn">添加</button>
      </form>
      <p id="add-error" class="error" hidden></p>
    </section>

    <!-- 用户列表 -->
    <section class="card">
      <h2>用户列表</h2>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>姓名</th>
            <th>密码</th>
            <th>年龄</th>
            <th>性别</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="user-tbody">
          <tr><td colspan="6" class="empty">加载中...</td></tr>
        </tbody>
      </table>

      <div class="pagination">
        <button id="prev-btn">上一页</button>
        <span id="page-info">第 1 页</span>
        <button id="next-btn">下一页</button>
      </div>
    </section>
  </div>

  <!-- 编辑用户弹窗 -->
  <div id="edit-modal" class="modal" hidden>
    <div class="modal-box">
      <h3>编辑用户</h3>
      <form id="edit-form">
        <label>姓名</label>
        <input name="name" required>
        <label>密码</label>
        <input name="password" required>
        <label>年龄（可选）</label>
        <input name="age" type="number" min="0" max="150">
        <label>性别（可选）</label>
        <select name="gender">
          <option value="男">男</option>
          <option value="女">女</option>
          <option value="未知">未知</option>
        </select>
        <p id="edit-error" class="error" hidden></p>
        <div class="modal-actions">
          <button type="button" class="secondary" id="edit-cancel">取消</button>
          <button type="submit">保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 删除确认弹窗 -->
  <div id="delete-modal" class="modal" hidden>
    <div class="modal-box">
      <h3>删除用户</h3>
      <p id="delete-text">确定要删除该用户吗？</p>
      <div class="modal-actions">
        <button type="button" class="secondary" id="delete-cancel">取消</button>
        <button type="button" class="danger" id="delete-confirm">删除</button>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
